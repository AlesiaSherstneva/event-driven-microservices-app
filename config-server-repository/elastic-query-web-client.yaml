server:
  port: 8184
  servlet:
    context-path: /elastic-query-web-client

elastic-query-web-client:
  webclient:
    connect-timeout-ms: 10000
    read-timeout-ms: 10000
    write-timeout-ms: 10000
    max-in-memory-size: 10485760 # 10 MB
    content-type: "application/json"
    accept-type: "application/json"
    base-url: "http://elastic-query-service/elastic-query-service/documents"
    service-id: elastic-query-service
    instances:
      -
        id: elastic-query-service-1
        host: localhost
        port: 8183
      - id: elastic-query-service-2
        host: localhost
        port: 8185
  query-by-text:
    method: POST
    uri: "/by-text"
    accept: ${elastic-query-web-client.webclient.accept-type}

spring:
  thymeleaf:
    cache: false
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: 'elastic-query-web-client'
            client-secret: '8y1aBQJO8/6Z7o9/uo937FHs2Y3CfrDf5Gl88xKSdUY='
            authorization-grand-type: authorization_code
            redirect-uri: '{baseUrl}/login/oauth2/code/{registrationId}'
            scope: openid
        provider:
          keycloak:
            issuerUri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8080}/realms/twitter-service-realm

