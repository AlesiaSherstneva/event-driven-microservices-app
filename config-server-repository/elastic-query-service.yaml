elastic-query-service:
  version: v1
  custom-audience: elastic-query-service
  webclient:
    connect-timeout-ms: 10000
    read-timeout-ms: 10000
    write-timeout-ms: 10000
    max-in-memory-size: 10485760 # 10 MB
    content-type: 'application/vnd.api.v1+json'
    accept-type: 'application/vnd.api.v1+json'
    # query-type: 'KAFKA_STATE_STORE'
    query-type: 'ANALYTICS_DATABASE'
  query-from-kafka-state-store:
    method: GET
    # uri: "http://${KAFKA_STREAMS_HOST:localhost}:${KAFKA_STREAMS_PORT:8187}/analytics-service/get-word-count-by-word/{word}"
    uri: "http://${ANALYTICS_HOST:localhost}:${ANALYTICS_PORT:8188}/analytics-service/get-word-count-by-word/{word}"
    accept: ${elastic-query-service.webclient.accept-type}

server:
  port: 8183
  servlet:
    context-path: /elastic-query-service

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:${KEYCLOAK_PORT:8080}/realms/twitter-service-realm
          jwk-set-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8080}/realms/twitter-service-realm/protocol/openid-connect/certs
      client:
        registration:
          keycloak:
            client-id: 'elastic-query-service'
            client-secret: '0KvJQVvwKidvs6f5jFGSGkRmz7/QpLnRx2t1wzX5ubg='
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            authorization-uri: http://localhost:8080/realms/twitter-service-realm/protocol/openid-connect/auth
            token-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8080}/realms/twitter-service-realm/protocol/openid-connect/token
            jwk-set-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8080}/realms/twitter-service-realm/protocol/openid-connect/certs
            user-info-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8080}/realms/twitter-service-realm/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username
  jpa:
    open-in-view: false
    ddl-auto: validate
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/postgres?currentSchema=public&binaryTransfer=true&rewriteBatchInserts=true
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schemas/init-schema.sql
      data-locations: classpath:schemas/init-data.sql

elastic-query-config:
  text-field: text

elastic-config:
  index-name: twitter-index
  connection-url: '${ELASTIC_CONFIG_CONNECTION_URL:http://localhost:9200}'
  connect-timeout-ms: 5000
  socket-timeout-ms: 30000

user-config:
  username: test
  password: '{bcrypt}$2a$12$lONUZ9zZT/HeRCLYWTHl.eoIKi5VqRl2dR/xHxCaYCi2qsKzssBuy' # test1234
  roles: USER

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

security:
  paths-to-ignore: /api-docs