services:
  # Prometheus
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    hostname: prometheus
    ports:
      - "9094:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus:/prometheus
    mem_limit: 256m
    networks:
      - ${GLOBAL_NETWORK:-services}

  # Grafana
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    hostname: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana:/var/lib/grafana
      - ./config/grafana:/etc/grafana/provisioning
    environment:
      - "GF_SECURITY_ADMIN_USER=admin"
      - "GF_SECURITY_ADMIN_PASSWORD=admin"
    mem_limit: 256m
    networks:
      - ${GLOBAL_NETWORK:-services}

  # Logstash
  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION}
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx512m"
      CLUSTER_NAME: es-twitter-cluster
      XPACK_MONITORING_ELASTICSEARCH_HOSTS: http://elastic:9200
    mem_limit: 512m
    ports:
      - "9600:9600"
      - "5001:5000"
    volumes:
      - ./config/log4j2.conf:/etc/logstash/conf.d/log4j2.conf
      - ./docker-logs/logstash:/logs
    command: logstash -f /etc/logstash/conf.d/log4j2.conf
    networks:
      - ${GLOBAL_NETWORK:-services}
    depends_on:
      elastic:
        condition: service_healthy

  # Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION}
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elastic:9200
      NODE_OPTIONS: "--max-old-space-size=512"
    mem_limit: 768m
    networks:
      - ${GLOBAL_NETWORK:-services}
    depends_on:
      elastic:
        condition: service_healthy

  # Zipkin
  zipkin:
    image: openzipkin/zipkin:{ZIPKIN_VERSION}
    hostname: zipkin
    container_name: zipkin
    ports:
      - "9411:9411"
    environment:
      - "JAVA_OPTS=-Xmx256m -Dlogging.level.zipkin2=DEBUG"
      - "KAFKA_BOOTSTRAP_SERVERS=kafka-broker-1:9192, kafka-broker-2:9192, kafka-broker-3:9192"
    networks:
      - ${GLOBAL_NETWORK:-services}