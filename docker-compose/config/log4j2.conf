input {
    tcp {
        port => 5000
        codec => json_lines
        type => "log4j2"
    }
}

filter {
    date {
        match => [ "timeMillis", "UNIX_MS" ]
        target => "@timestamp"
        remove_field => [ "timeMillis" ]
    }
}

output {
    if [type] == "log4j2" {
        elasticsearch {
            hosts => ["http://elastic-1:9200"]
            index => "log4j2-microservices-%{+YYYY.MM.dd}"
        }
    }

    stdout { codec => json }
}