services:
  elastic-query-service-1:
    image: ${GROUP_ID}/elastic.query.service:${SERVICE_VERSION:-latest}
    ports:
      - "5008:5008"
      - "8183:8183"
    volumes:
      - "./docker-logs:/workspace/elastic-query-service/logs"
    environment:
      - "JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5008 -Xms128m -Xmx256m"
      - "LOGGING_LEVEL_COM_MICROSERVICES=info"
      - "LOGGING_LEVEL_ROOT=info"
      - "ELASTIC-CONFIG_INDEX-NAME=twitter-index"
      - "ELASTIC-CONFIG_CONNECTION-URL=http://elastic:9200"
      - "SERVER_PORT=8183"
      - "SERVER_SERVLET_CONTEXT-PATH=/elastic-query-service"
      - "CONFIG_SERVER_HOST=http://config-server:8888"
      - "DB_HOST=postgres"
      - "DB_PORT=5432"
      - "KEYCLOAK_HOST=keycloak-authorization-server"
      - "KEYCLOAK_PORT=8080"
      - "KAFKA_STREAMS_HOST=kafka-streams-service"
      - "KAFKA_STREAMS_PORT=8187"
      - "ANALYTICS_HOST=analytics-service"
      - "ANALYTICS_PORT=8188"
      - "ENCRYPT_KEY=${ENCRYPT_KEY}"
    networks:
      - ${GLOBAL_NETWORK:-services}
    depends_on:
      config-server:
        condition: service_healthy
      kafka-to-elastic-service:
        condition: service_started
      elastic:
        condition: service_healthy

  elastic-query-service-2:
    image: ${GROUP_ID}/elastic.query.service:${SERVICE_VERSION:-latest}
    ports:
      - "5009:5009"
      - "8185:8185"
    volumes:
      - "./docker-logs:/workspace/elastic-query-service/logs"
    environment:
      - "JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5009 -Xms128m -Xmx256m"
      - "LOGGING_LEVEL_COM_MICROSERVICES=info"
      - "LOGGING_LEVEL_ROOT=info"
      - "ELASTIC-CONFIG_INDEX-NAME=twitter-index"
      - "ELASTIC-CONFIG_CONNECTION-URL=http://elastic:9200"
      - "SERVER_PORT=8185"
      - "SERVER_SERVLET_CONTEXT-PATH=/elastic-query-service"
      - "CONFIG_SERVER_HOST=http://config-server:8888"
      - "SPRING_SQL_INIT_MODE=never"
      - "DB_HOST=postgres"
      - "DB_PORT=5432"
      - "KEYCLOAK_HOST=keycloak-authorization-server"
      - "KEYCLOAK_PORT=8080"
      - "KAFKA_STREAMS_HOST=kafka-streams-service"
      - "KAFKA_STREAMS_PORT=8187"
      - "ANALYTICS_HOST=analytics-service"
      - "ANALYTICS_PORT=8188"
      - "ENCRYPT_KEY=${ENCRYPT_KEY}"
    networks:
      - ${GLOBAL_NETWORK:-services}
    depends_on:
      config-server:
        condition: service_healthy
      kafka-to-elastic-service:
        condition: service_started
      elastic:
        condition: service_started

  elastic-query-service-reactive:
    image: ${GROUP_ID}/elastic.query.service.reactive:${SERVICE_VERSION:-latest}
    ports:
      - "5014:5014"
      - "8190:8183"
    volumes:
      - "./docker-logs:/workspace/elastic-query-service-reactive/logs"
    environment:
      - "JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5014 -Xms128m -Xmx256m"
      - "LOGGING_LEVEL_COM_MICROSERVICES=info"
      - "LOGGING_LEVEL_ROOT=info"
      - "ELASTIC-CONFIG_INDEX-NAME=twitter-index"
      - "SPRING_ELASTICSEARCH_URIS=http://elastic:9200"
      - "SERVER_PORT=8183"
      - "SERVER_SERVLET_CONTEXT-PATH=/elastic-query-service-reactive"
      - "CONFIG_SERVER_HOST=http://config-server:8888"
      - "ENCRYPT_KEY=${ENCRYPT_KEY}"
    networks:
      - ${GLOBAL_NETWORK:-services}
    depends_on:
      config-server:
        condition: service_healthy
      elastic:
        condition: service_healthy

  elastic-query-web-client:
    image: ${GROUP_ID}/elastic.query.web.client:${SERVICE_VERSION:-latest}
    ports:
      - "5010:5010"
      - "8184:8184"
    volumes:
      - "./docker-logs:/workspace/elastic-query-web-client/logs"
    environment:
      - "JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5010 -Xms128m -Xmx256m"
      - "LOGGING_LEVEL_COM_MICROSERVICES=info"
      - "LOGGING_LEVEL_ROOT=info"
      - "SERVER_PORT=8184"
      - "SERVER_SERVLET_CONTEXT-PATH=/elastic-query-web-client"
      - "CONFIG_SERVER_HOST=http://config-server:8888"
      - "ELASTIC-QUERY-WEB-CLIENT_WEB-CLIENT_BASE=http://api-gateway/elastic-query-service/documents"
      - "ELASTIC-QUERY-WEB-CLIENT_WEB-CLIENT_INSTANCES_0_ID=elastic-query-service-1"
      - "ELASTIC-QUERY-WEB-CLIENT_WEB-CLIENT_INSTANCES_0_HOST=elastic-query-service-1"
      - "ELASTIC-QUERY-WEB-CLIENT_WEB-CLIENT_INSTANCES_0_PORT=8183"
      - "ELASTIC-QUERY-WEB-CLIENT_WEB-CLIENT_INSTANCES_1_ID=elastic-query-service-2"
      - "ELASTIC-QUERY-WEB-CLIENT_WEB-CLIENT_INSTANCES_1_HOST=elastic-query-service-2"
      - "ELASTIC-QUERY-WEB-CLIENT_WEB-CLIENT_INSTANCES_1_PORT=8185"
      - "KEYCLOAK_HOST=keycloak-authorization-server"
      - "KEYCLOAK_PORT=8080"
      - "ENCRYPT_KEY=${ENCRYPT_KEY}"
    networks:
      - ${GLOBAL_NETWORK:-services}
    depends_on:
      config-server:
        condition: service_healthy
      keycloak-authorization-server:
        condition: service_healthy

  elastic-query-web-client-reactive:
    image: ${GROUP_ID}/elastic.query.web.client.reactive:${SERVICE_VERSION:-latest}
    ports:
      - "5011:5011"
      - "8189:8184"
    volumes:
      - "./docker-logs:/workspace/elastic-query-web-client-reactive/logs"
    environment:
      - "JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5011 -Xms128m -Xmx256m"
      - "LOGGING_LEVEL_COM_MICROSERVICES=info"
      - "LOGGING_LEVEL_ROOT=info"
      - "SERVER_PORT=8184"
      - "SERVER_SERVLET_CONTEXT-PATH=/elastic-query-web-client-reactive"
      - "CONFIG_SERVER_HOST=http://config-server:8888"
      - "ENCRYPT_KEY=${ENCRYPT_KEY}"
    networks:
      - ${GLOBAL_NETWORK:-services}
    depends_on:
      config-server:
        condition: service_healthy
      elastic-query-service-reactive:
        condition: service_started