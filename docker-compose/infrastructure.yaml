services:
  # Kafka cluster
  kafka-1:
    image: apache/kafka:latest
    container_name: kafka-broker-1
    environment:
      CLUSTER_ID: r4zt_wrqTRuT7W2NJsB_GA
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9094,2@kafka-2:9094,3@kafka-3:9094
      KAFKA_LISTENERS: PLAINTEXT://:9192,CONTROLLER://:9094,EXTERNAL://:9091
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9192,EXTERNAL://localhost:9091
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    ports:
      - 9091:9091
    volumes:
      - .\volumes\kafka\server-1:/var/lib/kafka/data
    networks:
      - ${GLOBAL_NETWORK:-services}

  kafka-2:
    image: apache/kafka:latest
    container_name: kafka-broker-2
    environment:
      CLUSTER_ID: r4zt_wrqTRuT7W2NJsB_GA
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9094,2@kafka-2:9094,3@kafka-3:9094
      KAFKA_LISTENERS: PLAINTEXT://:9192,CONTROLLER://:9094,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9192,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    ports:
      - 9092:9092
    volumes:
      - .\volumes\kafka\server-2:/var/lib/kafka/data
    networks:
      - ${GLOBAL_NETWORK:-services}

  kafka-3:
    image: apache/kafka:latest
    container_name: kafka-broker-3
    environment:
      CLUSTER_ID: r4zt_wrqTRuT7W2NJsB_GA
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9094,2@kafka-2:9094,3@kafka-3:9094
      KAFKA_LISTENERS: PLAINTEXT://:9192,CONTROLLER://:9094,EXTERNAL://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9192,EXTERNAL://localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    ports:
      - 9093:9093
    volumes:
      - .\volumes\kafka\server-3:/var/lib/kafka/data
    networks:
      - ${GLOBAL_NETWORK:-services}

  # Schema registry
  schema-registry:
    image: confluentinc/cp-schema-registry:latest
    container_name: schema-registry
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    ports:
      - 8081:8081
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "kafka-1:9192,kafka-2:9192,kafka-3:9192"
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: "PLAINTEXT"
    restart: unless-stopped
    networks:
      - ${GLOBAL_NETWORK:-services}
    healthcheck:
      test: [ "CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9192", "--list" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Elasticsearch cluster
  elastic:
    image: elasticsearch:9.0.2
    container_name: elastic
    environment:
      node.name: elastic-1
      cluster.name: es-twitter-cluster
      discovery.type: single-node
      bootstrap.memory_lock: true
      xpack.security.enabled: false
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      cluster.routing.allocation.disk.watermark.low: 90%
      cluster.routing.allocation.disk.watermark.high: 95%
      cluster.routing.allocation.disk.watermark.flood_stage: 97%
      readiness.port: 9201
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - 9200:9200
    volumes:
      - .\volumes\elastic\data:/usr/share/elasticsearch/data
    networks:
      - ${GLOBAL_NETWORK:-services}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9201' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  # Postgres DB for Keycloak
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5433:5432
    volumes:
      - .\volumes\postgres\data:/var/lib/postgresql
    networks:
      - ${GLOBAL_NETWORK:-services}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d keycloak" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Keycloak authorization server
  keycloak-authorization-server:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-latest}
    container_name: keycloak-authorization-server
    hostname: keycloak-server
    ports:
      - 8080:8080
      - 9000:9000
    volumes:
      - ..\app-config-data\src\main\resources\realm-export.json:/opt/keycloak/data/import/realm-export.json
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HOSTNAME_STRICT: false
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/keycloak/bin/kc.sh import --file /opt/keycloak/data/import/realm-export.json --override true
        exec /opt/keycloak/bin/kc.sh start-dev
    networks:
      - ${GLOBAL_NETWORK:-services}
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; 
              grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 120s
    depends_on:
      config-server:
        condition: service_healthy

networks:
  application:
    driver: bridge